# リリース自動化: Release PRの作成〜タグ付け〜exe添付までを行う。
#
# 仕組み:
#   1. mainへのpushごとに release-please がConventional Commitsを解析し、
#      Cargo.toml/CHANGELOG.md をバンプする Release PR を自動作成・自動更新する
#   2. Release PR をマージすると、GitHub Release(タグ付き・即公開) が自動作成される
#   3. publishジョブがマージコミットを windows-latest でビルドして exe を添付する
#      Why draftにしない: draft Releaseは公開までタグを生成しないため、Release PRマージ時の
#      同一実行が「未リリース」と誤認し、Release-As込みの降格PRを毎リリース作成する
#      (googleapis/release-please-action#962)。exe添付までの数分間は資産なしで公開されるが、
#      セルフアップデートはDL失敗時に手動導線へフォールバックするため影響は軽微。
#
# 前提(リポジトリ設定で一度だけ有効化):
#   - Settings > Actions > General > Allow GitHub Actions to create and approve pull requests
#
# 旧CalVer版(v2026.*)の利用者への案内:
#   手動作成した sentinel リリース v9999.99.99(資産なし・本文は案内文)を常にLatestへ
#   固定し続ける。旧版exeは/releases/latestのタグを辞書順比較して「更新あり」と判定する
#   ため、sentinelが通知の発火元として機能する。新版はReleases一覧からSemVerタグのみを
#   選ぶためsentinelの影響を受けない(src/update.rs参照)。
#   旧版利用者がいなくなったと判断したら、sentinelのリリースと「sentinelをLatestへ
#   固定し直す」ステップを削除すればよい。

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # Release PRマージ時にのみ実行するビルド&添付ジョブ。
  # Why 同一ワークフロー内で受ける: GITHUB_TOKENが作成したReleaseは on: release イベントを
  #   発火しないため、別ワークフローに分けるとPATが必須になり期限管理が発生する。
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      # チェックアウトはRelease PRのマージコミット(=Releaseのtarget_commitishと同一SHA)。
      # Why refにタグを指定しない: タグfetchのタイムラグに左右されないSHA素通しが最も確実なため。
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: exeをビルド
        run: cargo build --release
        # Why 環境変数での版指定が不要: Release PRがCargo.tomlをバンプ済みのため、
        # build.rsのCARGO_PKG_VERSIONフォールバックが正しい版を焼き込む
      - name: exeをReleaseへ添付
        shell: bash
        # Note: windows-latest の既定シェルは pwsh。"$TAG_NAME" 展開のために bash を明示する。
        run: gh release upload "$TAG_NAME" target/release/alt-ime-rs.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      - name: sentinelをLatestへ固定し直す
        # リリース作成のたびLatestが新リリースへ奪われるため元へ戻す。
        # sentinel未作成期間(初回リリース直後)は失敗してよい(ジョブは緑のまま)。
        continue-on-error: true
        shell: bash
        run: gh release edit v9999.99.99 --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
